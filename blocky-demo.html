<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坐垫渲染对比：方块 → 插值 → 加边 → 高斯</title>
<style>
  body { margin:0; background:#0b0f16; color:#d6e6ff; font-family:-apple-system,"PingFang SC",sans-serif; padding:20px; }
  h1 { font-size:18px; font-weight:600; }
  p.sub { color:#6a8aaa; font-size:13px; margin-top:-6px; }
  .grid { display:flex; flex-wrap:wrap; gap:24px; margin-top:20px; }
  .panel { background:#0d1520; border:1px solid #1a3050; border-radius:10px; padding:14px; }
  .panel h2 { font-size:14px; margin:0 0 4px; color:#7cc4ff; }
  .panel .desc { font-size:11px; color:#6a8aaa; margin:0 0 10px; height:28px; }
  canvas { display:block; background:#000; border-radius:4px; image-rendering:pixelated; }
  .size { font-size:11px; color:#889; margin-top:6px; text-align:center; }
  .legend { display:flex; align-items:center; gap:8px; margin-top:24px; font-size:12px; color:#6a8aaa; }
  .bar { width:200px; height:14px; border-radius:3px;
    background:linear-gradient(90deg,#fff,#a0a0b4,#1e40b4,#005aff,#00c8ff,#00ff50,#96ff00,#ffff00,#ff8c00,#ff5000,#dc1414); }
</style>
</head>
<body>
  <h1>同一份坐垫压力数据 · 四种渲染</h1>
  <p class="sub">数据来自 SEATED_SENSOR_FRAME 的坐垫段（10行 × 6列 = 60 个真实压力值），颜色用项目里的 jetWhite3</p>

  <div class="grid">
    <div class="panel">
      <h2>① 原始方块</h2>
      <p class="desc">传感器真实数据，60 个格子直接上色，不做任何处理</p>
      <canvas id="c1" width="240" height="400"></canvas>
      <div class="size">10 × 6 = 60</div>
    </div>
    <div class="panel">
      <h2>② + 插值</h2>
      <p class="desc">格子之间线性补出中间值，方块之间开始有过渡</p>
      <canvas id="c2" width="240" height="400"></canvas>
      <div class="size">37 × 26 = 962</div>
    </div>
    <div class="panel">
      <h2>③ + 加边</h2>
      <p class="desc">四周补一圈 0，边缘自然衰减，不再硬截断</p>
      <canvas id="c3" width="240" height="400"></canvas>
      <div class="size">43 × 32 = 1376</div>
    </div>
    <div class="panel">
      <h2>④ + 高斯模糊</h2>
      <p class="desc">磨圆台阶 —— 这就是 3D 图里最终看到的样子</p>
      <canvas id="c4" width="240" height="400"></canvas>
      <div class="size">43 × 32 = 1376</div>
    </div>
  </div>

  <div class="legend">
    <span>低压力</span>
    <div class="bar"></div>
    <span>高压力</span>
  </div>

<script>
// ── 项目里的颜色表 rainbowTextColorsxy（util.js）──
const COLORS = [
  [220,20,20],[240,50,10],[255,80,0],[255,110,0],[255,140,0],
  [255,170,0],[255,200,0],[255,230,0],[255,255,0],[230,255,0],
  [200,255,0],[150,255,0],[100,255,0],[50,255,30],[0,255,80],
  [0,255,140],[0,255,200],[0,240,255],[0,200,255],[0,160,255],
  [0,120,255],[0,90,255],[10,60,220],[20,40,180],
  [30,30,140],[60,60,120],[100,100,140],[160,160,180],
  [200,200,210],[230,230,240],[255,255,255],
];
// jetWhite3(min,max,x) 的移植：值越大越红，0 是白
function jetWhite3(min, max, x) {
  if (!x) return COLORS[COLORS.length - 1];
  const L = COLORS.length;
  const range = (max - min) * 2;
  const t = range > 0 ? Math.max(0, Math.min(x / range, 1)) : 0;
  const idx = t * (L - 1);
  const f = Math.floor(idx), c = Math.min(f + 1, L - 1), frac = idx - f;
  const c0 = COLORS[L - 1 - f], c1 = COLORS[L - 1 - c];
  return [c0[0]+(c1[0]-c0[0])*frac, c0[1]+(c1[1]-c0[1])*frac, c0[2]+(c1[2]-c0[2])*frac];
}
const COLOR_MAX = 325; // DEFAULT_SETTINGS.color

// ── 坐垫原始 10×6 数据（SEATED_SENSOR_FRAME[84..143]）──
const RAW = [
  10, 15, 20, 22, 16, 10,
  18, 30, 45, 48, 35, 20,
  25, 45, 68, 72, 50, 28,
  35, 58, 85, 90, 65, 38,
  45, 70, 98, 105, 78, 48,
  55, 82, 115, 120, 88, 55,
  60, 90, 125, 130, 95, 62,
  55, 85, 118, 122, 90, 58,
  40, 65, 90, 95, 70, 42,
  20, 35, 50, 52, 38, 22,
];
const RW = 6, RH = 10;

// ── ① 原始方块：每个格子一个纯色方块 ──
function drawBlocky(id) {
  const cv = document.getElementById(id), ctx = cv.getContext('2d');
  const cw = cv.width / RW, ch = cv.height / RH;
  for (let i = 0; i < RH; i++)
    for (let j = 0; j < RW; j++) {
      const rgb = jetWhite3(0, COLOR_MAX, RAW[i*RW+j]*10);
      ctx.fillStyle = `rgb(${rgb[0]|0},${rgb[1]|0},${rgb[2]|0})`;
      ctx.fillRect(j*cw, i*ch, cw+1, ch+1);
    }
}

// ── 线性插值：宽 6→26，高 10→37 ──（简化版双线性）
function interp(src, w, h, ix, iy) {
  const nw = 1 + (w-1)*ix, nh = 1 + (h-1)*iy;
  const out = new Array(nw*nh).fill(0);
  for (let i = 0; i < nh; i++)
    for (let j = 0; j < nw; j++) {
      const fx = j/ix, fy = i/iy;
      const x0 = Math.floor(fx), y0 = Math.floor(fy);
      const x1 = Math.min(x0+1, w-1), y1 = Math.min(y0+1, h-1);
      const dx = fx-x0, dy = fy-y0;
      const v = src[y0*w+x0]*(1-dx)*(1-dy) + src[y0*w+x1]*dx*(1-dy)
              + src[y1*w+x0]*(1-dx)*dy    + src[y1*w+x1]*dx*dy;
      out[i*nw+j] = v;
    }
  return {data: out, w: nw, h: nh};
}

// ── 加边：四周补 pad 圈 0 ──
function addSide(src, w, h, pad) {
  const nw = w + pad*2, nh = h + pad*2;
  const out = new Array(nw*nh).fill(0);
  for (let i = 0; i < h; i++)
    for (let j = 0; j < w; j++)
      out[(i+pad)*nw + (j+pad)] = src[i*w+j];
  return {data: out, w: nw, h: nh};
}

// ── 高斯模糊 ──
function gauss(src, w, h, r) {
  const rs = Math.ceil(r*2.57);
  const out = new Array(w*h).fill(0);
  for (let i = 0; i < h; i++)
    for (let j = 0; j < w; j++) {
      let val=0, wsum=0;
      for (let dy=-rs; dy<=rs; dy++)
        for (let dx=-rs; dx<=rs; dx++) {
          const x=Math.min(w-1,Math.max(0,j+dx)), y=Math.min(h-1,Math.max(0,i+dy));
          const wght=Math.exp(-(dx*dx+dy*dy)/(2*r*r));
          val += src[y*w+x]*wght; wsum += wght;
        }
      out[i*w+j] = val/wsum;
    }
  return {data: out, w, h};
}

// ── 把一个矩阵按“每格一色”画到 canvas（放大填满）──
function drawMatrix(id, m) {
  const cv = document.getElementById(id), ctx = cv.getContext('2d');
  const cw = cv.width / m.w, ch = cv.height / m.h;
  for (let i = 0; i < m.h; i++)
    for (let j = 0; j < m.w; j++) {
      const rgb = jetWhite3(0, COLOR_MAX, m.data[i*m.w+j]*10);
      ctx.fillStyle = `rgb(${rgb[0]|0},${rgb[1]|0},${rgb[2]|0})`;
      ctx.fillRect(j*cw, i*ch, cw+1, ch+1);
    }
}

drawBlocky('c1');
const step2 = interp(RAW, RW, RH, 5, 4);           // ② 插值 → 26×37
drawMatrix('c2', step2);
const step3 = addSide(step2.data, step2.w, step2.h, 3); // ③ 加边 → 32×43
drawMatrix('c3', step3);
const step4 = gauss(step3.data, step3.w, step3.h, 1.5); // ④ 高斯
drawMatrix('c4', step4);
</script>
</body>
</html>
